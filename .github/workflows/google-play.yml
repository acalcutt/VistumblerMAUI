# Google Play publishing - disabled for now; uncomment everything below to turn it on. GitLab CI does the same in its
# release-play-store job.
#
# After "Build and Release" (release.yml) succeeds, uploads the AAB it built (artifact play-artifact-android) to
# Google Play with build/Publish-GooglePlay.ps1 and releases it on the PLAY_TRACK track. Runs where release.yml
# skipped the release (no AAB) do nothing, and so does an AAB whose versionCode (<ApplicationVersion>) is already
# in Play, so re-running is safe. The API can't create the app or its first release: upload the first AAB by hand
# in Play Console.
#
# Settings > Environments > release:
#   Secret    PLAY_SERVICE_ACCOUNT_BASE64  base64 of the JSON key of a Google Cloud service account invited to the
#                                          techidiots-llc Play Console with release permissions
#   Variable  PLAY_TRACK                   Optional: internal (default), alpha, beta or production
#   Variable  PLAY_RELEASE_STATUS          Optional: completed (default), or draft until the app's first release is
#                                          published in Play Console (Play only accepts drafts before that)

