# VistumblerMAUI CI on the Windows shell runner (tag "windows"). GitLab ignores the GitHub workflows in .github/.
#
#   ci-windows, ci-android  Merge requests and pushes to main: publish the Windows app (win-x64, win-arm64) and a
#                           debug-signed Android APK as job artifacts (7 days). Port of .github/workflows/ci.yml.
#   ci-ios-simulator        Same, on the macOS runner (tag "macos"): the iOS simulator app as a job artifact (7 days).
#                           Port of the GitHub build-ios job; MACOS_RUNNER "false" skips it.
#   ci-maccatalyst          Same: the macOS app (Mac Catalyst, universal, ad-hoc signed) as a job artifact (7 days).
#   release-*               Push to main: if no GitLab release exists for <ApplicationDisplayVersion>, publish the
#                           Windows zips, a Windows NSIS installer per architecture (build/installer.nsi) and the
#                           release-signed Android APK, and create the release with the CHANGELOG.md notes.
#                           Port of .github/workflows/release.yml.
#   release-android-play    Alongside the release: the Google Play build (PLAY_STORE: no in-app updater) as a
#                           signed AAB job artifact (90 days). Not a release file.
#   release-play-store      Uploads that AAB to Google Play and releases it on PLAY_TRACK (build/Publish-GooglePlay.ps1).
#                           Skips when its versionCode (<ApplicationVersion>) is already in Play, and with a warning
#                           when PLAY_SERVICE_ACCOUNT_BASE64 isn't set.
#   bump-version           Build > Pipelines > New pipeline with BUMP_VERSION set: bump the version and changelog,
#                           push release-v<version> and open a merge request. Port of .github/workflows/bump-version.yml.
#
# CI/CD variables (Settings > CI/CD > Variables), Protected + Masked, environment scope "signing/main":
#   CI_PUSH_TOKEN              Project access token, role Maintainer, scopes api + write_repository (bump-version only)
#   ANDROID_KEYSTORE_BASE64    Base64 of the release keystore (the Android release job fails without it)
#   ANDROID_KEYSTORE_PASSWORD  Keystore password (also used as the key password)
#   ANDROID_KEY_ALIAS          Key alias
#   ANDROID_KEY_PASSWORD       Optional: key password, only if it differs from the keystore password (PKCS12
#                              keystores, the keytool default, always use the same password for both)
#   SIG_PFX_B64, SIG_PFX_PASS  Optional: Windows code-signing .pfx (base64) and password; without them the Windows exe
#                              and installers are published unsigned, with a warning
#   PLAY_SERVICE_ACCOUNT_BASE64  Optional: base64 of the JSON key of a Google Cloud service account invited to the
#                              techidiots-llc Play Console with release permissions; without it the AAB isn't uploaded
#                              to Play, with a warning

workflow:
  rules:
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    # Avoid a duplicate branch pipeline while a merge request is open for the branch
    - if: $CI_COMMIT_BRANCH && $CI_OPEN_MERGE_REQUESTS && $CI_PIPELINE_SOURCE == "push"
      when: never
    - if: $CI_COMMIT_BRANCH

variables:
  BUMP_VERSION:
    value: "none"
    options: ["none", "patch", "minor", "major", "prepatch", "preminor", "premajor", "prerelease"]
    description: "Version bump type. Leave as 'none' to just build and release the current version."
  BUMP_PREID:
    value: "rc"
    description: "Prerelease identifier for the pre* bump types (e.g. alpha, beta, rc)."
  PLAY_TRACK:
    value: "internal"
    options: ["internal", "alpha", "beta", "production"]
    description: "Google Play track for the release (alpha = closed testing, beta = open testing)."
  PLAY_RELEASE_STATUS:
    value: "completed"
    options: ["completed", "draft"]
    description: "Google Play release status. Use draft until the app's first release is published in Play Console."
  MACOS_RUNNER:
    value: "true"
    description: "Build the iOS simulator and macOS apps on the runner tagged macos ('false' to skip them)."

default:
  tags: [windows]

stages:
  - check
  - build
  - release

# Jobs that sign or push run in this environment; scope the protected variables to it.
.signing-environment: &signing-environment
  name: signing/$CI_COMMIT_BRANCH
  action: prepare

.ci-rules: &ci-rules
  - if: $BUMP_VERSION != "none"
    when: never
  - if: $CI_PIPELINE_SOURCE == "merge_request_event"
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.release-rules: &release-rules
  - if: $BUMP_VERSION != "none"
    when: never
  - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH

.rid-matrix: &rid-matrix
  - RID: [win-x64, win-arm64]

# .NET for the jobs that build the app: SDK band 10.0.4xx with workload set 10.0.401 (MAUI 10.0.20, as the csproj uses).
# The runner's dotnet-workload-env (gitlab-runner-install) gives these pins a .NET install of their own, so parallel
# jobs don't restore workloads into the shared C:\Program Files\dotnet at once (which fails with "being used by another
# process"). Its full path is tried too, for a runner service that hasn't been restarted since it was installed.
# Without it, the shared install's workloads are restored as before.
.dotnet-windows: &dotnet-windows
  - |
    $envHelper = Get-Command dotnet-workload-env -ErrorAction SilentlyContinue
    if (-not $envHelper -and (Test-Path 'C:\GitLab-Runner\bin\dotnet-workload-env.ps1')) { $envHelper = 'C:\GitLab-Runner\bin\dotnet-workload-env.ps1' }
    if ($envHelper) { & $envHelper -Sdk 10.0.4xx -WorkloadSet 10.0.401 }
    else { dotnet workload restore VistumblerMAUI.sln }

# Windows publish, shared by CI and release.
# -r with -p:UseMonoRuntime=false: this csproj also targets Android/iOS, so an explicit RID otherwise makes NuGet
# look for a Mono runtime pack for the Windows head, which doesn't exist (NU1101). The RID is needed to
# cross-build win-arm64 on the x64 runner. No separate restore: publish does a RID-aware restore (NETSDK1112).
# --self-contained + WindowsAppSDKSelfContained bundle both runtimes. No PublishSingleFile: WinUI 3 doesn't support it.
.publish-windows: &publish-windows
  - *dotnet-windows
  - dotnet publish VistumblerMAUI/VistumblerMAUI.csproj -f net10.0-windows10.0.19041.0 -c Release -r $env:RID
      --self-contained true -p:WindowsPackageType=None -p:UseMonoRuntime=false -p:WindowsAppSDKSelfContained=true
      --output ./publish/$env:RID

# ── CI ──────────────────────────────────────────────────────────────────────────────────────────────

ci-windows:
  stage: build
  rules: *ci-rules
  parallel:
    matrix: *rid-matrix
  script:
    - *publish-windows
    - $version = ([regex]::Match((Get-Content VistumblerMAUI/VistumblerMAUI.csproj -Raw), '<ApplicationDisplayVersion>([^<]+)')).Groups[1].Value
    - Compress-Archive -Path "./publish/$env:RID/*" -DestinationPath "./VistumblerMAUI-v$version-ci$env:CI_PIPELINE_IID-$env:CI_COMMIT_SHORT_SHA-$env:RID.zip"
  artifacts:
    name: ci-app-windows-$RID
    paths:
      - VistumblerMAUI-*.zip
    expire_in: 7 days

ci-android:
  stage: build
  rules: *ci-rules
  script:
    - *dotnet-windows
    - dotnet restore VistumblerMAUI.sln
    # Not release-signed: .NET Android falls back to a debug key that differs per run, so this APK installs on a
    # clean device but won't upgrade a release install. No -r: one universal APK with android-arm64 + android-x64.
    - dotnet publish VistumblerMAUI/VistumblerMAUI.csproj -f net10.0-android36.0 -c Release --output ./publish/android
    - $apk = Get-ChildItem ./publish/android -Filter *-Signed.apk -Recurse | Select-Object -First 1
    - if (-not $apk) { $apk = Get-ChildItem ./publish/android -Filter *.apk -Recurse | Select-Object -First 1 }
    - if (-not $apk) { throw 'No APK found under ./publish/android' }
    - $version = ([regex]::Match((Get-Content VistumblerMAUI/VistumblerMAUI.csproj -Raw), '<ApplicationDisplayVersion>([^<]+)')).Groups[1].Value
    - Copy-Item $apk.FullName "./VistumblerMAUI-v$version-ci$env:CI_PIPELINE_IID-$env:CI_COMMIT_SHORT_SHA-android-debug-signed.apk"
  artifacts:
    name: ci-app-android
    paths:
      - VistumblerMAUI-*.apk
    expire_in: 7 days

# iOS simulator build on the macOS runner (tag "macos"; see the gitlab-runner-install project). Port of the GitHub
# build-ios job. A build, not a publish: there is no iOS release, and a device build would need signing assets CI
# doesn't have; the simulator .app is the runnable artifact. Pinned like the other jobs (SDK 10.0.4xx, workload set
# 10.0.401, which builds with Xcode 26). The runner's architecture picks the simulator: iossimulator-x64 on an Intel
# Mac, iossimulator-arm64 on Apple silicon. Set MACOS_RUNNER to "false" to skip it while no macOS runner is online.
ci-ios-simulator:
  stage: build
  tags: [macos]
  rules:
    - if: $MACOS_RUNNER != "true" || $BUMP_VERSION != "none"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      # dotnet-workload-env gives these pins a .NET install of their own, so other jobs on the Mac can't change it
      if command -v dotnet-workload-env > /dev/null; then
        eval "$(dotnet-workload-env --sdk 10.0.4xx --workload-set 10.0.401)"
      else
        dotnet workload restore VistumblerMAUI.sln --version 10.0.401
      fi
      dotnet --version
    - |
      # The iOS platform is a separate Xcode download (the runner script skips it with --skip-ios-platform)
      if ! xcodebuild -showsdks 2>/dev/null | grep -q iphonesimulator; then
        echo "Xcode on this runner has no iOS platform. Re-run install-macos-runner.sh without --skip-ios-platform,"
        echo "or run: xcodebuild -downloadPlatform iOS"
        exit 1
      fi
    - if [ "$(uname -m)" = arm64 ]; then RID=iossimulator-arm64; else RID=iossimulator-x64; fi
    # -p:EnableWindowsTargeting=true: the csproj also targets Windows, and restore evaluates every TargetFramework
    # even when -f picks one (NETSDK1100 otherwise). No separate restore: the explicit RID needs a RID-aware restore.
    - dotnet build VistumblerMAUI/VistumblerMAUI.csproj -f net10.0-ios -c Release -p:EnableWindowsTargeting=true -p:RuntimeIdentifier=$RID
    - |
      BASE=VistumblerMAUI/bin/Release/net10.0-ios/$RID
      APP=$(find "$BASE" -maxdepth 1 -name '*.app' -type d | head -1)
      [ -z "$APP" ] && APP=$(find "$BASE" -name '*.app' -type d | head -1)
      if [ -z "$APP" ]; then echo "No .app bundle found under $BASE"; find "$BASE" -maxdepth 3 || true; exit 1; fi
      VERSION=$(sed -n 's:.*<ApplicationDisplayVersion>\(.*\)</ApplicationDisplayVersion>.*:\1:p' VistumblerMAUI/VistumblerMAUI.csproj | head -1)
      # ditto keeps the bundle's executable bits and symlinks, without which the simulator won't launch it
      ditto -c -k --sequesterRsrc --keepParent "$APP" "VistumblerMAUI-v$VERSION-ci$CI_PIPELINE_IID-$CI_COMMIT_SHORT_SHA-$RID.zip"
  artifacts:
    name: ci-app-ios-simulator
    paths:
      - VistumblerMAUI-*-iossimulator-*.zip
    expire_in: 7 days

# The macOS app (Mac Catalyst) on the macOS runner: one universal .app for Apple silicon and Intel Macs, ad-hoc signed
# (no Developer ID yet: the first launch needs right-click › Open), as a job artifact. Pinned like the iOS job.
ci-maccatalyst:
  stage: build
  tags: [macos]
  rules:
    - if: $MACOS_RUNNER != "true" || $BUMP_VERSION != "none"
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH
  script:
    - |
      if command -v dotnet-workload-env > /dev/null; then
        eval "$(dotnet-workload-env --sdk 10.0.4xx --workload-set 10.0.401)"
      else
        dotnet workload restore VistumblerMAUI.sln --version 10.0.401
      fi
      dotnet --version
    # A build, not a publish (publish wraps the app in an installer .pkg). EnableWindowsTargeting: restore evaluates the
    # Windows TargetFramework too (NETSDK1100 otherwise). Signed ad-hoc below instead of looking for a certificate.
    - dotnet build VistumblerMAUI/VistumblerMAUI.csproj -f net10.0-maccatalyst -c Release -p:EnableWindowsTargeting=true -p:EnableCodeSigning=false
    - |
      BASE=VistumblerMAUI/bin/Release/net10.0-maccatalyst
      APP=$(find "$BASE" -maxdepth 1 -name '*.app' -type d | head -1)
      [ -z "$APP" ] && APP=$(find "$BASE" -maxdepth 2 -name '*.app' -type d | head -1)
      if [ -z "$APP" ]; then echo "No .app bundle found under $BASE"; find "$BASE" -maxdepth 3 || true; exit 1; fi
      lipo -info "$APP/Contents/MacOS/"* || true
      # Apple silicon refuses to run unsigned code; an ad-hoc signature is enough to launch
      codesign --force --deep --sign - "$APP"
      VERSION=$(sed -n 's:.*<ApplicationDisplayVersion>\(.*\)</ApplicationDisplayVersion>.*:\1:p' VistumblerMAUI/VistumblerMAUI.csproj | head -1)
      ditto -c -k --sequesterRsrc --keepParent "$APP" "VistumblerMAUI-v$VERSION-ci$CI_PIPELINE_IID-$CI_COMMIT_SHORT_SHA-macos.zip"
  artifacts:
    name: ci-app-macos
    paths:
      - VistumblerMAUI-*-macos.zip
    expire_in: 7 days

# ── Release ─────────────────────────────────────────────────────────────────────────────────────────

release-check:
  stage: check
  rules: *release-rules
  script:
    - ./.gitlab/scripts/release-check.ps1 -Project VistumblerMAUI/VistumblerMAUI.csproj -Element ApplicationDisplayVersion
  artifacts:
    reports:
      dotenv: release.env

release-windows:
  stage: build
  rules: *release-rules
  needs: [release-check]
  environment: *signing-environment
  parallel:
    matrix: *rid-matrix
  script:
    - if ($env:RELEASE_PUBLISHED -eq 'true') { Write-Host "Release $env:RELEASE_TAG already exists; skipping."; exit 0 }
    - *publish-windows
    # Signs only the app's own exe (the runtime's createdump/RestartAgent are already Microsoft-signed); skipped with a
    # warning when SIG_PFX_B64 isn't set
    - ./build/Sign-Files.ps1 -Path ./publish/$env:RID/VistumblerMAUI.exe
    - New-Item -ItemType Directory release-files -Force | Out-Null
    - Compress-Archive -Path "./publish/$env:RID/*" -DestinationPath "./release-files/VistumblerMAUI-v$env:RELEASE_VERSION-$env:RID.zip"
    # NSIS installer (Start Menu shortcut, uninstaller) alongside the portable zip
    - $setup = "./release-files/VistumblerMAUI-v$env:RELEASE_VERSION-$env:RID-setup.exe"
    - ./build/Build-Installer.ps1 -SourceDir ./publish/$env:RID -AppName VistumblerMAUI -AppExe VistumblerMAUI.exe
        -Version $env:RELEASE_VERSION -Arch ($env:RID -replace '^win-', '') -Icon ./publish/$env:RID/appicon.ico -OutFile $setup
    - ./build/Sign-Files.ps1 -Path $setup
  artifacts:
    paths:
      - release-files/
    expire_in: 7 days

# Android release signing, shared by the APK and Play jobs. Releases must be signed with the fixed release keystore:
# without one .NET Android silently uses a random debug key, so users couldn't upgrade in place. Fail rather than ship
# that. The Play build uses the same key, so Play installs and APK installs can update each other; that needs Play App
# Signing set up with "use existing app signing key" for this keystore.
.android-signing: &android-signing
  - if ([string]::IsNullOrWhiteSpace($env:ANDROID_KEYSTORE_BASE64)) { throw 'ANDROID_KEYSTORE_BASE64 is not set - refusing to build an unsigned/debug-signed release.' }
  - $keystore = Join-Path ([IO.Path]::GetTempPath()) "vistumbler-release-$env:CI_JOB_ID.keystore"
  - '[IO.File]::WriteAllBytes($keystore, [Convert]::FromBase64String($env:ANDROID_KEYSTORE_BASE64))'
  # The key password defaults to the keystore password; set ANDROID_KEY_PASSWORD only if they differ
  - $keyPassword = if ($env:ANDROID_KEY_PASSWORD) { $env:ANDROID_KEY_PASSWORD } else { $env:ANDROID_KEYSTORE_PASSWORD }
  - $signing = @('-p:AndroidKeyStore=true', "-p:AndroidSigningKeyStore=$keystore", "-p:AndroidSigningStorePass=$env:ANDROID_KEYSTORE_PASSWORD",
      "-p:AndroidSigningKeyAlias=$env:ANDROID_KEY_ALIAS", "-p:AndroidSigningKeyPass=$keyPassword")
  - *dotnet-windows
  - dotnet restore VistumblerMAUI.sln

.android-signing-cleanup: &android-signing-cleanup
  - Remove-Item (Join-Path ([IO.Path]::GetTempPath()) "vistumbler-release-$env:CI_JOB_ID.keystore") -Force -ErrorAction SilentlyContinue

release-android:
  stage: build
  rules: *release-rules
  needs: [release-check]
  environment: *signing-environment
  script:
    - if ($env:RELEASE_PUBLISHED -eq 'true') { Write-Host "Release $env:RELEASE_TAG already exists; skipping."; exit 0 }
    - *android-signing
    - dotnet publish VistumblerMAUI/VistumblerMAUI.csproj -f net10.0-android36.0 -c Release @signing --output ./publish/android
    - $apk = Get-ChildItem ./publish/android -Filter *-Signed.apk -Recurse | Select-Object -First 1
    - if (-not $apk) { $apk = Get-ChildItem ./publish/android -Filter *.apk -Recurse | Select-Object -First 1 }
    - if (-not $apk) { throw 'No APK found under ./publish/android' }
    - New-Item -ItemType Directory release-files -Force | Out-Null
    - Copy-Item $apk.FullName "./release-files/VistumblerMAUI-v$env:RELEASE_VERSION-android.apk"
  after_script: *android-signing-cleanup
  artifacts:
    paths:
      - release-files/
    expire_in: 7 days

# release-play-store uploads this AAB to Play; it can also be uploaded by hand (Play Console > Test and release).
# Play rejects a versionCode it has seen before, so each upload needs a higher <ApplicationVersion>.
release-android-play:
  stage: build
  rules: *release-rules
  needs: [release-check]
  environment: *signing-environment
  script:
    - if ($env:RELEASE_PUBLISHED -eq 'true') { Write-Host "Release $env:RELEASE_TAG already exists; skipping."; exit 0 }
    - *android-signing
    - dotnet publish VistumblerMAUI/VistumblerMAUI.csproj -f net10.0-android36.0 -c Release -p:PlayStore=true @signing --output ./publish/android-play
    - $aab = Get-ChildItem ./publish/android-play -Filter *-Signed.aab -Recurse | Select-Object -First 1
    - if (-not $aab) { $aab = Get-ChildItem ./publish/android-play -Filter *.aab -Recurse | Select-Object -First 1 }
    - if (-not $aab) { throw 'No AAB found under ./publish/android-play' }
    - New-Item -ItemType Directory play-files -Force | Out-Null
    - Copy-Item $aab.FullName "./play-files/VistumblerMAUI-v$env:RELEASE_VERSION-play.aab"
  after_script: *android-signing-cleanup
  artifacts:
    paths:
      - play-files/
    expire_in: 90 days

# Google Play setup (one time):
#   1. Play Console (techidiots-llc developer account): create the app and upload the first AAB by hand to Test and
#      release > Testing > Internal testing; the API can't create an app or its first release. Get the AAB from the
#      release-android-play job of a release pipeline (Browse > play-files/), and choose "use existing app signing key"
#      for the release keystore so Play and APK installs can update each other. (Done for 0.3.11, versionCode 16.)
#   2. Google Cloud Console: in a project, enable the Google Play Android Developer API (APIs & Services > Library),
#      create a service account with no roles (IAM & Admin > Service accounts) and add a JSON key (Keys > Add key).
#   3. Play Console > Users and permissions > Invite new users: the service account's email, with app permissions for
#      Vistumbler: "Release apps to testing tracks" and "Manage testing tracks and edit tester lists", plus "Release
#      to production, exclude devices, and use Play App Signing" for PLAY_TRACK=production. The API can take a while
#      to accept a newly invited account.
#   4. Settings > CI/CD > Variables: PLAY_SERVICE_ACCOUNT_BASE64, Protected + Masked, environment scope "signing/main",
#      set to the base64 of the JSON key: [Convert]::ToBase64String([IO.File]::ReadAllBytes('key.json')). Then delete
#      the key file. To test, retry this job in a release pipeline: it should report its versionCode is already in Play.
# Then each release merged to main is uploaded to PLAY_TRACK. If Play answers "Only releases with status draft may be
# created on draft app" (no production release yet), run with PLAY_RELEASE_STATUS=draft and roll out in Play Console.
release-play-store:
  stage: release
  rules: *release-rules
  needs: [release-check, release-android-play]
  environment: *signing-environment
  resource_group: play-store
  script:
    - if ($env:RELEASE_PUBLISHED -eq 'true') { Write-Host "Release $env:RELEASE_TAG already exists; skipping."; exit 0 }
    - ./build/Publish-GooglePlay.ps1 -Aab "./play-files/VistumblerMAUI-v$env:RELEASE_VERSION-play.aab"
        -Track $env:PLAY_TRACK -Status $env:PLAY_RELEASE_STATUS

release-publish:
  stage: release
  rules: *release-rules
  needs: [release-check, release-windows, release-android]
  resource_group: release
  script:
    - ./.gitlab/scripts/publish-release.ps1 -PackageName vistumblermaui

# ── Version bump ────────────────────────────────────────────────────────────────────────────────────

bump-version:
  stage: build
  resource_group: bump-version
  environment: *signing-environment
  rules:
    - if: $CI_PIPELINE_SOURCE == "web" && $BUMP_VERSION != "none"
  variables:
    GIT_DEPTH: 0   # full history: the changelog lists merge requests since the last tag
  script:
    - ./.gitlab/scripts/bump.ps1 -BumpType $env:BUMP_VERSION -PreId $env:BUMP_PREID
